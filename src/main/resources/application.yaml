server:
  port: 8081

logging:
  level:
    com.eventsourcing: DEBUG

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/myapp
          audiences:
            - backend-api

  # Database Connection Settings
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres_db
    username: postgres_user
    password: postgres_password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties.hibernate.format_sql: true

  # Kafka Cluster Address
  kafka:
    bootstrap-servers: localhost:9092
  
    # Consumer Configuration
    consumer:
#      group-id: order-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      isolation-level: read_committed
      enable-auto-commit: false

    # Producer Configuration
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: tx-order-api- # Enable kafka transaction manager
      acks: all # Make sure all in-sync-replicas have the message before the leader ack it; 1 = leader only; 0 = fire and forget
      properties:
        enable.idempotence: true
        max.block.ms: 3000 # to get the transactional producer id
        delivery.timeout.ms: 10000 # message sent total time including retry
        request.timeout.ms: 5000 # message sent initial time including the ack time

    listener:
      concurrency: 1               # Spawns 1 consumer threads for parallel processing. Can be overwritten in the @KafkaListener(concurrency=3)
      missing-topics-fatal: false  # Prevents the app from crashing if a Kafka topic doesn't exist yet